<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <div class="todo">
        <h2>My Tasks</h2>

        <div class="input">
            <input 
                id="todoInput" 
                type="text" 
                class="input-field" 
                placeholder="Write a task..."
            >
            <button class="btn" id="addButton">Add</button>
        </div>

        <ul id="todoList" class="scroll"></ul>

        <div class="counter">
            <div class="counter-container">
                <p>Total:</p>
                <span id="todoCount">0</span>
            </div>
        </div>

        <div class="footer">
            <button id="deleteButton" class="footer-delete">Clear All</button>
        </div>
    </div>

</body>
</html>
